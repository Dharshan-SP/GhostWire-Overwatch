<!-- images.html: Displays all captured images with metadata -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Captured Images</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>Captured Images</h2>
    <table class="table table-bordered table-hover mt-3">
        <thead>
            <tr>
                <th>Image</th>
                <th>Device</th>
                <th>Time</th>
                <th>Filename</th>
            </tr>
        </thead>
        <tbody>
        {% for img in images %}
            <tr>
                <td><img src="/images/{{ img.filename }}" alt="Image" style="max-width:150px;"></td>
                <td>{{ img.device }}</td>
                <td>{{ img.time }}</td>
                <td>{{ img.filename }}</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
