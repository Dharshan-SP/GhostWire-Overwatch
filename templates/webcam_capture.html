{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Webcam Capture</h2>
    <form method="POST" action="{{ url_for('webcam_capture') }}">
        <button type="submit" class="btn btn-primary">Capture Webcam Image</button>
    </form>
    {% if image_url %}
    <div class="mt-4">
        <h5>Last Captured Image:</h5>
        <img src="{{ image_url }}" alt="Webcam Image" class="img-fluid" style="max-width:400px;">
        <p class="mt-2">Captured at: {{ timestamp }}</p>
        <p>Device: {{ device }}</p>
    </div>
    {% endif %}
</div>
{% endblock %}
